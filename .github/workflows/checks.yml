name: Workstation checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r backend/requirements.txt
          npm --prefix frontend ci
      - name: Backend reference, accounting and persistence tests
        run: .venv/bin/python -m unittest discover -s backend/tests -v
      - name: Frontend unit tests and production build
        run: |
          npm --prefix frontend test
          npm --prefix frontend run build
      - name: Install test browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser integration tests (isolated database, no live provider)
        working-directory: frontend
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
